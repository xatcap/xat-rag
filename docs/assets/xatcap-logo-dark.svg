<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="xatcap logo: a relaxed cat in sunglasses and a tilted witch hat">
  <defs><clipPath id="disc"><circle cx="128" cy="128" r="124"/></clipPath></defs>
  <g clip-path="url(#disc)">
    <!-- ears -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round">
      <path d="M64 156 L64 100 L108 124 Z"/>
      <path d="M192 156 L192 100 L148 124 Z"/>
    </g>
    <!-- head -->
    <path d="M128 112 C176 112 206 136 206 170 C206 204 172 222 128 222 C84 222 50 204 50 170 C50 136 80 112 128 112 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
    <!-- sunglasses, slight tilt -->
    <g transform="rotate(-4 128 164)">
      <path d="M72 154 H120 Q122 154 121 158 L117 172 Q114 182 102 182 H90 Q76 182 73 170 L70 158 Q70 154 72 154 Z" fill="#000000"/>
      <path d="M136 154 H184 Q186 154 186 158 L183 170 Q180 182 166 182 H154 Q142 182 139 172 L135 158 Q134 154 136 154 Z" fill="#000000"/>
      <path d="M118 158 Q128 153 138 158" fill="none" stroke="#000000" stroke-width="4"/>
      <path d="M58 156 H72 M184 156 H198" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M82 160 L76 172" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M148 160 L142 172" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- nose and smirk -->
    <path d="M123 190 H133 Q128 197 123 190 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M120 204 Q132 206 142 199" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
    <!-- toothpick -->
    <path d="M140 201 L170 192" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
    <!-- witch hat, tipped low and to one side -->
    <g transform="rotate(-12 128 122)" stroke="#000000" stroke-width="6" stroke-linejoin="round">
      <path d="M88 126 L116 52 C122 34 142 22 176 24 C152 34 144 48 146 64 L168 126 Z" fill="#FFFFFF"/>
      <path d="M94 108 H162 L166 120 H90 Z" fill="#000000" stroke="none"/>
      <path d="M44 130 C72 114 184 114 212 130 C184 144 72 144 44 130 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
