name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  ci:
    # All CI jobs must pass on the commit of the tag. The package job also makes the service archives.
    uses: ./.github/workflows/ci.yml

  models:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Get and check the locked models
        run: uv run python tools/fetch_models.py
      - name: Archive the models and the lock file
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python build/release.py archive-models "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: build/out/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    # Only this job can write to the repository, so it runs no code from the repository or its dependencies.
    runs-on: ubuntu-latest
    needs: models
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Get the archives of this run
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Make the GitHub release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --generate-notes
