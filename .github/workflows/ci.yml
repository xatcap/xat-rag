name: ci

on:
  pull_request:
  workflow_call: # The release workflow runs these jobs on the commit of the tag.

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Keep the pre-built wheels (torch and others), so that a run does not download them again.
          prune-cache: false
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('build/models.lock.json') }}
      - name: Get and check the locked models (build time only)
        run: uv run python tools/fetch_models.py
      - name: Lint and format
        run: |
          set -e
          uv run ruff check packages tools build
          uv run ruff format --check packages tools build
      - name: Types
        run: uv run pyright
      - name: Import rules
        run: uv run lint-imports
      - name: Tests (sockets blocked, except loopback where a test allows it)
        run: uv run pytest
      - name: Dependency allowlist and licenses
        run: uv run python tools/check_dependencies.py
      - name: Retrieval quality gate
        run: uv run xat-rag-eval run --setup eval/fixtures/setup --golden eval/fixtures/golden.jsonl --data ${{ runner.temp }}/eval --baseline eval/baseline.json

  offline:
    # The service tests run again in a network namespace that has only loopback. Any connection that is
    # not loopback fails, so this checks from outside the process that xat-rag needs no network.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Keep the pre-built wheels (torch and others), so that a run does not download them again.
          prune-cache: false
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('build/models.lock.json') }}
      - run: uv run python tools/fetch_models.py
      - name: Service tests without network, with tracing variables set
        env:
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: fake
          LANGSMITH_RUNS_ENDPOINTS: '{"https://example.invalid": "fake"}'
        # A new network namespace has only loopback, and loopback starts down. Any connection that is not
        # loopback fails, so this checks from outside the process that nothing needs the network.
        # The outer sudo sets HOME to /root, and the runner user cannot read /root. Docling reads font
        # folders in HOME when it opens a PDF, so give the tests the HOME of the runner user.
        run: |
          sudo unshare --net -- sh -c "ip link set lo up && sudo -E -u $USER env HOME=$HOME PATH=$PATH \
            .venv/bin/python -m pytest packages/xat-rag-service packages/xat-rag -p no:cacheprovider"

  package:
    # Freeze the service with PyInstaller on each platform, and run the smoke test of the frozen folder.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Keep the pre-built wheels (torch and others), so that a run does not download them again.
          prune-cache: false
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('build/models.lock.json') }}
      - run: uv run python tools/fetch_models.py
      - run: uv run python build/release.py package
      - run: uv run python build/release.py check-bundle
      # When a job does not end well, the smoke test dumps the threads of the service with py-spy. py-spy is a CI
      # tool only, and only Windows lets it read the service without root. A failed install does not stop the job.
      - name: Install py-spy
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          uv tool install py-spy==0.4.3
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: uv run python build/release.py smoke-test
      # Only a release keeps the frozen folder, so that it publishes the same files that the smoke test used.
      - name: Archive the frozen folder
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python build/release.py archive "$TAG"
      - name: Keep the archive for the release job
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: service-${{ matrix.os }}
          path: build/out/release/*
          if-no-files-found: error
          compression-level: 0
