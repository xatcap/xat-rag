[project]
name = "xat-rag-workspace"
version = "0.1.0"
description = "Workspace root for xat-rag. Not published."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# Use only the Python builds that uv manages. Some system builds cannot load SQLite extensions,
# and the vector search needs them (ADR 0002).
python-preference = "only-managed"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "xat-rag-offline",
    "xat-rag-core",
    "xat-rag-sqlite",
    "xat-rag-parsers",
    "xat-rag-documents",
    "xat-rag-onnx",
    "xat-rag-tokenizers",
    "xat-rag",
    "xat-rag-service",
    "xat-rag-eval",
    "httpx>=0.27",
    "pyinstaller>=6.11",
]

[tool.uv.sources]
xat-rag-offline = { workspace = true }
xat-rag-core = { workspace = true }
xat-rag-sqlite = { workspace = true }
xat-rag-parsers = { workspace = true }
xat-rag-documents = { workspace = true }
xat-rag-onnx = { workspace = true }
xat-rag-tokenizers = { workspace = true }
xat-rag = { workspace = true }
xat-rag-service = { workspace = true }
xat-rag-eval = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT", "D"]
ignore = [
    "D203", "D213", "D105", "D107",
    "PLR0913", "PLR2004",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["D", "S", "PLR", "RUF001"]
# The store builds SQL only from fixed text and "?" placeholders. All values, also field names, are parameters.
"packages/xat-rag-sqlite/src/xat_rag_sqlite/store.py" = ["S608"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["packages"]
exclude = ["**/.venv", "**/__pycache__"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket -q"
testpaths = ["packages"]
pythonpath = []

[tool.importlinter]
root_packages = ["xat_rag_offline", "xat_rag_core", "xat_rag_sqlite", "xat_rag_parsers", "xat_rag_documents", "xat_rag_onnx", "xat_rag_tokenizers", "xat_rag", "xat_rag_service", "xat_rag_eval"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "xat_rag_offline imports nothing from the workspace or LangChain"
type = "forbidden"
source_modules = ["xat_rag_offline"]
forbidden_modules = [
    "xat_rag_core", "xat_rag_sqlite", "xat_rag_parsers", "xat_rag_documents", "xat_rag_onnx",
    "xat_rag_tokenizers", "xat_rag", "xat_rag_service", "xat_rag_eval", "langchain_core", "langsmith",
]

[[tool.importlinter.contracts]]
name = "No banned LangChain packages or tiktoken"
type = "forbidden"
source_modules = ["xat_rag_offline", "xat_rag_core", "xat_rag_sqlite", "xat_rag_parsers", "xat_rag_documents", "xat_rag_onnx", "xat_rag_tokenizers", "xat_rag", "xat_rag_service", "xat_rag_eval"]
forbidden_modules = ["langchain_community", "langchain_classic", "langchain", "tiktoken"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Core depends on no other workspace package"
type = "forbidden"
source_modules = ["xat_rag_core"]
forbidden_modules = ["xat_rag_sqlite", "xat_rag_offline", "xat_rag_parsers", "xat_rag_documents", "xat_rag_onnx", "xat_rag_tokenizers", "xat_rag"]

[[tool.importlinter.contracts]]
name = "Adapters do not import each other"
type = "independence"
modules = ["xat_rag_sqlite", "xat_rag_parsers", "xat_rag_documents", "xat_rag_onnx", "xat_rag_tokenizers"]

[[tool.importlinter.contracts]]
name = "The library does not import the service"
type = "forbidden"
source_modules = ["xat_rag"]
forbidden_modules = ["xat_rag_service"]
