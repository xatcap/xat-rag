[project]
name = "xat-rag-documents"
version = "0.1.0"
description = "PDF, DOCX and HTML parsers of xat-rag, with limits against bad files."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "xat-rag-core",
    "pypdf==7.0.0",
    "python-docx==1.2.0",
    "beautifulsoup4==4.15.0",
]

[tool.uv.sources]
xat-rag-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag_documents"]
