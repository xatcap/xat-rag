[project]
name = "xat-rag"
version = "0.1.0"
description = "The xat-rag library: recipes, the composition root, ingestion and context packs for small local models."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "xat-rag-core",
    "xat-rag-sqlite",
    "xat-rag-parsers",
    "xat-rag-documents",
    "xat-rag-logs",
    "xat-rag-onnx",
    "xat-rag-tokenizers",
    "pydantic>=2.9,<3",
]

[tool.uv.sources]
xat-rag-core = { workspace = true }
xat-rag-sqlite = { workspace = true }
xat-rag-parsers = { workspace = true }
xat-rag-documents = { workspace = true }
xat-rag-logs = { workspace = true }
xat-rag-onnx = { workspace = true }
xat-rag-tokenizers = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag"]
