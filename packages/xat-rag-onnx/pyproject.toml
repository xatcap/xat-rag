[project]
name = "xat-rag-onnx"
version = "0.1.0"
description = "The ONNX embedder and reranker of xat-rag, from locked files, on the CPU."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "xat-rag-core",
    "numpy>=2.1,<3",
    "langchain-core>=1.7.6,<2",
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
]

[tool.uv.sources]
xat-rag-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag_onnx"]
