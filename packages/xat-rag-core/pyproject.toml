[project]
name = "xat-rag-core"
version = "0.1.0"
description = "Domain model, ports, errors, sanitizing, query types, fusion, MMR and ranking of xat-rag."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.1,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag_core"]
