[project]
name = "xat-rag-tokenizers"
version = "0.1.0"
description = "Generator token counters and generator profiles of xat-rag."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["xat-rag-core", "tokenizers==0.23.3"]

[tool.uv.sources]
xat-rag-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag_tokenizers"]
