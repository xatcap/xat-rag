[project]
name = "xat-rag-logs"
version = "0.1.0"
description = "The log query builder of xat-rag: masking, templates, identifiers and the input section."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["xat-rag-core"]

[tool.uv.sources]
xat-rag-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag_logs"]
