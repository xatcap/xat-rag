[project]
name = "xat-rag-service"
version = "0.1.0"
description = "The loopback HTTP service of xat-rag."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "xat-rag",
    "xat-rag-offline",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
]

[project.scripts]
xat-rag-service = "xat_rag_service.main:main"

[tool.uv.sources]
xat-rag = { workspace = true }
xat-rag-offline = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag_service"]
