[project]
name = "xat-rag-parsers"
version = "0.1.0"
description = "Text parsers (markdown, text, diff, jira, prompt) and the structural chunker of xat-rag."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "xat-rag-core",
    "markdown-it-py>=4.0,<5",
    "unidiff>=0.7.5,<2",
    "semantic-text-splitter==0.33.1",
    "numpy>=2",
]

[tool.uv.sources]
xat-rag-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag_parsers"]
