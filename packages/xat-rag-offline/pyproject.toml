[project]
name = "xat-rag-offline"
version = "0.1.0"
description = "Startup hardening for the xat-rag service: tracing off, offline settings and a network guard."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag_offline"]
