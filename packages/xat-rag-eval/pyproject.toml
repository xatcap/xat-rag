[project]
name = "xat-rag-eval"
version = "0.1.0"
description = "The evaluation harness of xat-rag: golden sets, retrieval metrics and the CI gate."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["xat-rag", "xat-rag-core", "xat-rag-logs"]

[project.scripts]
xat-rag-eval = "xat_rag_eval.cli:main"

[tool.uv.sources]
xat-rag = { workspace = true }
xat-rag-core = { workspace = true }
xat-rag-logs = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xat_rag_eval"]
